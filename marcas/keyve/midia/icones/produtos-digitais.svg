<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <radialGradient id="sv3Orb" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E54FF"/>
      <stop offset="55%" stop-color="#0D38F2"/>
      <stop offset="100%" stop-color="#091545"/>
    </radialGradient>
    <linearGradient id="sv3Rim" x1="12%" y1="88%" x2="88%" y2="12%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#1B43F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="sv3Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Esfera Build Luminosa -->
  <circle cx="200" cy="140" r="102" fill="url(#sv3Orb)" stroke="url(#sv3Rim)" stroke-width="3" filter="url(#sv3Glow)"/>
  <!-- Anel de Modelagem Vetorial (Bezier) -->
  <ellipse cx="200" cy="140" rx="132" ry="46" fill="none" stroke="url(#sv3Rim)" stroke-width="2" stroke-dasharray="6 6" transform="rotate(-18 200 140)"/>
  <rect x="74" y="174" width="12" height="12" rx="3" fill="#05070B" stroke="#38BDF8" stroke-width="2.5"/>
  <rect x="314" y="94" width="12" height="12" rx="3" fill="#05070B" stroke="#A855F7" stroke-width="2.5"/>
  <!-- Cubo Isométrico Principal (Fiel ao Build.png) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 200 80 L 252 108 L 252 168 L 200 196 L 148 168 L 148 108 Z"/>
    <polyline points="148,108 200,138 252,108"/>
    <line x1="200" y1="138" x2="200" y2="196"/>
  </g>
  <!-- Pontos de Ancoragem de Modelagem -->
  <circle cx="200" cy="80" r="6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="252" cy="108" r="6" fill="#6A4DFF" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="148" cy="108" r="6" fill="#6A4DFF" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="200" cy="138" r="6" fill="#FFFFFF"/>
</svg>