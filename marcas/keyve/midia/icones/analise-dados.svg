<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="sv5Orb" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="50%" stop-color="#1B43F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="sv5Rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="sv5Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Esfera Luminosa Azul-Roxo (Fiel ao Cases.png) -->
  <circle cx="200" cy="140" r="102" fill="url(#sv5Orb)" stroke="url(#sv5Rim)" stroke-width="3" filter="url(#sv5Glow)"/>
  <!-- Barras Brancas Brilhantes -->
  <rect x="146" y="164" width="20" height="30" rx="5" fill="#FFFFFF"/>
  <rect x="175" y="150" width="20" height="44" rx="5" fill="#FFFFFF"/>
  <rect x="204" y="134" width="20" height="60" rx="5" fill="#FFFFFF"/>
  <rect x="233" y="110" width="20" height="84" rx="5" fill="#FFFFFF"/>
  <!-- Curva de Crescimento Ascendente -->
  <path d="M 148 144 Q 196 126 241 78" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <path d="M 220 77 L 243 74 L 243 97" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pill Flutuante de Dados Processados -->
  <rect x="64" y="74" width="88" height="36" rx="12" fill="#070B19" stroke="#38BDF8" stroke-width="2" filter="url(#sv5Glow)"/>
  <circle cx="82" cy="92" r="5" fill="#38BDF8"/>
  <line x1="94" y1="92" x2="136" y2="92" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
</svg>