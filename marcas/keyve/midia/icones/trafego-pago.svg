<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <radialGradient id="sv7Orb" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="55%" stop-color="#0B1536"/>
      <stop offset="100%" stop-color="#05070B"/>
    </radialGradient>
    <linearGradient id="sv7Rim" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#1B43F6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="sv7Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Esfera Externa -->
  <circle cx="200" cy="140" r="102" fill="url(#sv7Orb)" stroke="url(#sv7Rim)" stroke-width="3" filter="url(#sv7Glow)"/>
  <!-- Anéis de Alvo e Precisão -->
  <circle cx="200" cy="140" r="68" fill="none" stroke="url(#sv7Rim)" stroke-width="3" opacity="0.7"/>
  <circle cx="200" cy="140" r="42" fill="#FFFFFF"/>
  <circle cx="200" cy="140" r="20" fill="#0D38F2"/>
  <!-- Seta de Conversão Certeira -->
  <line x1="278" y1="62" x2="204" y2="136" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" filter="url(#sv7Glow)"/>
  <line x1="278" y1="62" x2="204" y2="136" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <polygon points="200,140 206,118 222,134" fill="#FFFFFF"/>
  <!-- Ponto de Destaque Neon -->
  <circle cx="278" cy="62" r="10" fill="#6A4DFF" stroke="#FFFFFF" stroke-width="2.5" filter="url(#sv7Glow)"/>
</svg>