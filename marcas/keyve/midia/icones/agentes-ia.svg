  <!-- Estrela de 4 Pontas com Brilho Neon -->
  <path d="M 200 76 C 203 120 220 137 264 140 C 220 143 203 160 200 204 C 197 160 180 143 136 140 C 180 137 197 120 200 76 Z" fill="#060913" stroke="url(#sv9Rim)" stroke-width="6.5" stroke-linejoin="round" filter="url(#sv9Glow)"/>
